import io.papermc.paperweight.userdev.ReobfArtifactConfiguration

plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
    id 'com.gradleup.shadow' version '8.3.9'
    id 'xyz.jpenilla.run-paper' version '3.0.2'
}

group = 'me.hsgamer'
version = '1.16.0'
def snapshot = false
description = 'A preference world manager for Folia'

if (snapshot) {
    version = version + "-SNAPSHOT"
}

def versionFile = file("version")
if (!versionFile.exists()) {
    throw new GradleException("version file not found")
}
def serverVersion = versionFile.text.trim()

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "folia-inquistors-repo"
        url = "https://folia-inquisitors.github.io/FoliaDevBundle/"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "canvasmc-repo"
        url = uri("https://maven.canvasmc.io/snapshots")
    }
}

paperweight {
    paperweight.setReobfArtifactConfiguration(ReobfArtifactConfiguration.getMOJANG_PRODUCTION())
}

configurations.configureEach {
    resolutionStrategy.capabilitiesResolution.withCapability("com.destroystokyo.paper:paper-mojangapi") {
        select(candidates.first())
    }
}

dependencies {
    paperweight.foliaDevBundle("${serverVersion}.local-SNAPSHOT")

    compileOnly("io.canvasmc.canvas:canvas-api:1.21.11-R0.1-SNAPSHOT")

    def core = "4.5.7"
    implementation "me.hsgamer:hscore-bukkit-config:$core"
    implementation "me.hsgamer:hscore-bukkit-utils:$core"
    implementation "me.hsgamer:hscore-config-proxy:$core"
    implementation "me.hsgamer:hscore-common:$core"
    implementation "me.hsgamer:hscore-task:$core"

    def minelib = "1.2.5"
    implementation "io.github.projectunified:minelib-plugin-base:$minelib"
    implementation "io.github.projectunified:minelib-plugin-listener:$minelib"
    implementation "io.github.projectunified:minelib-plugin-permission:$minelib"

    def craftcommand = "0.9.1"
    compileOnly "io.github.projectunified:craftcommand-annotations:$craftcommand"
    compileOnly "io.github.projectunified:craftcommand-bukkit-annotations:$craftcommand"
    implementation "io.github.projectunified:craftcommand-paper-runtime:$craftcommand"
    annotationProcessor "io.github.projectunified:craftcommand-paper-processor:$craftcommand"
}

assemble {
    dependsOn shadowJar
}

shadowJar {
    relocate("me.hsgamer.hscore", "me.hsgamer.morefoworld.core")
    relocate("io.github.projectunified.minelib", "me.hsgamer.morefoworld.minelib")
    relocate("io.github.projectunified.craftcommand", "me.hsgamer.morefoworld.craftcommand")
    minimize()
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}

processResources {
    def props = [
            version    : version,
            name       : project.name,
            apiVersion : serverVersion,
            description: project.description
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}
